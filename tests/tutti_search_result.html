04", "locationName": "Winterthur", "canton": {"shortName": "ZH", "name": "Zürich"}}, "timestamp": "2026-09-02T11:07:32+02:00", "formattedPrice": "650.-", "formattedSource": null, "highlighted": false, "primaryCategory": {"categoryID": "bicycles"}, "sellerInfo": {"alias": "Kostas", "logoURL": null, "subscriptionInfo": null}, "images": [{"__typename": "ListingImage"}, {"__typename": "ListingImage"}, {"__typename": "ListingImage"}, {"__typename": "ListingImage"}, {"__typename": "ListingImage"}], "thumbnail": {"normalRendition": {"src": "https://c.tutti.ch/thumbnail/2304028175.jpg"}, "retinaRendition": {"src": "https://c.tutti.ch/big/2304028175.jpg"}}, "seoInformation": {"deSlug": "zuerich/sport-outdoor/velos/rennvelo-giant-tcr", "frSlug": "zurich/sport-outdoor/velos/rennvelo-giant-tcr", "itSlug": "zurigo/sport-e-outdoor/biciclette/rennvelo-giant-tcr"}}}, {"node": {"listingID": "80626035", "localization": {"title": "BMC Streamer Citybike", "body": "Neuwertiges BMC Streamer Velo. Stand bei meinen Eltern nur im Keller und darf nun weiterziehen. \n\nSchloss und Pumpe sind gleich dabei und haben ihren Platz am Fahrrad.\n\nAbholung und Probefahrt in Biel", "translationStatus": "ORIGINAL"}, "postcodeInformation": {"postcode": "2502", "locationName": "Biel/Bienne", "canton": {"shortName": "BE", "name": "Bern"}}, "timestamp": "2026-09-02T11:06:51+02:00", "formattedPrice": "280.-", "formattedSource": null, "highlighted": false, "primaryCategory": {"categoryID": "bicycles"}, "sellerInfo": {"alias": "Barbara", "logoURL": null, "subscriptionInfo": null}, "images": [{"__typename": "ListingImage"}, {"__typename": "ListingImage"}, {"__typename": "ListingImage"}, {"__typename": "ListingImage"}, {"__typename": "ListingImage"}], "thumbnail": {"normalRendition": {"src": "https://c.tutti.ch/thumbnail/0120688114.jpg"}, "retinaRendition": {"src": "https://c.tutti.ch/big/0120688114.jpg"}}, "seoInformation": {"deSlug": "bern/sport-outdoor/velos/bmc-streamer-citybike", "frSlug": "berne/sport-ou alität, kein billiger Import\n\nGepäckträger von Pletscher mit Geheimfach\n24 Gänge für flexibles Fahren überall hin\nZahlreiche einzigartige Details und die ansprechende Lackierung werten das Fahrrad zusätzlich auf\nGefederte Gabel und Sattelstange für konfortables Fahren\nElegantes, stilvolles Design für eine stilbewusste Ankunft\n\nTechnische Details:\nRahmengröße: 56cm+3cm Sattelstangenfederung, ideal für Körpergrössen von 1,68 m bis 1,83 m (je nach Schrittlänge)\n28 Zoll Räder\n\nSonstiges:\nNormale Gebrauchsspuren wie kleine Kratzer und kleinste Roststellen sind vorhanden\n\nEin hochwertiges Fahrrad, das Ihnen sowohl Komfort als auch eine stilvolle Fahrt garantiert.\n\nMehr als nur ein Velo.\nBeim Kauf eines Velos bei uns erhältst du einen Arbeitszeitgutschein im Wert von CHF 100.,\neinlösbar ausschliesslich in unserer Werkstatt und nur für das gekaufte Velo.\nDer Gutschein gilt ausschliesslich für Arbeitszeit.\nArbeitsstundensatz: CHF 50.\nErsatzteile und weitere Leistungen werden separat verrechnet.\nDie Dauer der Arbeiten und Dienstleistungen richtet sich nach den Angaben auf unserer Homepage.\nDer Gutschein ist einmalig einlösbar, nicht übertragbar, nicht teilbar und nicht auszahlbar.\nGültig 1 Jahr ab Kaufdatum, danach verfällt der Anspruch.\nDenn wir wollen, dass dein Velo nicht nur heute, sondern auch morgen perfekt läuft.\n", "translationStatus": "ORIGINAL"}, "postcodeInformation": {"postcode": "5600", "locationName": "Lenzburg", "canton": {"shortName": "AG", "name": "Aargau"}}, "timestamp": "2026-09-02T10:59:54+02:00", "formattedPrice": "499.-", "formattedSource": null, "highlighted": false, "primaryCategory": {"categoryID": "bicycles"}, "sellerInfo": {"alias": "Charmingbike", "logoURL": null, "subscriptionInfo": null}, "images": [{"__typename": "ListingImage"}, {"__typename": "ListingImage"}, {"__typename": "ListingImage"}, {"__typename": "ListingImage"}, {"__typename": "ListingImage"}], "thumbnail": {"normalRendition": {"src": "https://c.tutti.ch/th
